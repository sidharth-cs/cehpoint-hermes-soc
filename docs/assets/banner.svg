<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hermes SOC Analyst: an AI SOC analyst that investigates a real attack, cites every fact and waits for a human before it blocks">
